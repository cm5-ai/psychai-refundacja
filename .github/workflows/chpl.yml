name: ChPL - straznik zmian

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 4"   # co czwartek ok. 7:00 czasu polskiego

permissions:
  contents: write
  issues: write

jobs:
  chpl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Narzedzia PDF
        run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Sprawdz ChPL
        run: python3 generator/chpl_straz.py
      - name: Zapisz
        if: always()
        run: |
          git config user.name "psychai-bot"; git config user.email "actions@users.noreply.github.com"
          git add zrodla/ wyniki/ && git commit -qm "ChPL straz $(TZ=Europe/Warsaw date +%F)" && git push || true
      - name: Zgloszenie
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f ALARM ]; then
            gh issue create --title "ChPL - zmiany $(TZ=Europe/Warsaw date +%F)" --body "$(cat ALARM)

          Szczegoly: wyniki/chpl.md. Karty w projekcie NIE zmieniaja sie automatycznie - do przegladu przez lekarza."
          fi
