name: Spis RPL (leki psychiatryczne)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"   # co poniedziałek ok. 6:00 czasu polskiego

permissions:
  contents: write

jobs:
  spis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pobierz eksport RPL (CSV)
        run: |
          D=$(TZ=Europe/Warsaw date +%Y%m%d)
          curl -sSfL --retry 3 -o "Rejestr_$D.csv" "https://rejestrymedyczne.ezdrowie.gov.pl/api/rpl/medicinal-products/public-pl-report/get-csv"
          ls -la "Rejestr_$D.csv"
          echo "PLIK=Rejestr_$D.csv" >> $GITHUB_ENV
      - name: Zbuduj spis
        run: |
          mkdir -p rpl wyniki
          python3 generator/spis_rpl.py "$PLIK" REFUNDACJA_DATA.json rpl/RPL_PSYCH.json rpl/RAPORT.md 2>&1 | tee wyniki/spis-rpl.txt
          exit ${PIPESTATUS[0]}
      - name: Zapisz w repozytorium
        if: always()
        run: |
          git config user.name "psychai-bot"; git config user.email "actions@users.noreply.github.com"
          git add rpl/ wyniki/ && git commit -m "Spis RPL $(TZ=Europe/Warsaw date +%F)" && git push || true
