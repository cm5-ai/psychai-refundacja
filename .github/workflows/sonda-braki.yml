name: Sonda brakow MZ

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sprawdz obwieszczenie MZ o brakach
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          mkdir -p wyniki; O=wyniki/braki_sonda.txt; : > $O
          for u in https://dziennikmz.mz.gov.pl/DUM_MZ/2026/50/akt.pdf https://dziennikmz.mz.gov.pl/legalact/2026/ "https://www.gov.pl/web/zdrowie/obwieszczenia-ministra-zdrowia-lista-lekow-zagrozonych-brakiem-dostepnosci"; do
            echo "== $u" >> $O; curl -sSL -m 60 -o t.bin -w "HTTP %{http_code} %{content_type} %{size_download}\n" "$u" >> $O 2>&1
          done
          curl -sSfL -m 60 -o akt.pdf https://dziennikmz.mz.gov.pl/DUM_MZ/2026/50/akt.pdf && pdftotext -layout akt.pdf akt.txt && {
            echo "== linie: $(wc -l < akt.txt), GTIN: $(grep -oE '\b0?590[0-9]{10}\b' akt.txt | sort -u | wc -l)" >> $O
            head -60 akt.txt >> $O; echo "== probka z GTIN" >> $O; grep -m 15 -E '590[0-9]{10}' akt.txt >> $O; }
          curl -sSL -m 60 https://dziennikmz.mz.gov.pl/legalact/2026/ | grep -oiE 'href="[^"]*"[^>]*>[^<]*(brakiem|zagrożon)[^<]*' | head -20 >> $O || true
      - name: Zapisz
        run: |
          git config user.name "psychai-bot"; git config user.email "actions@users.noreply.github.com"
          git add wyniki/braki_sonda.txt && git commit -qm "Sonda brakow MZ" && git push || true
