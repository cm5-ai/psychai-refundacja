# L1 BRAMKA MERGE — rama, warstwa 1.
# Wchodza WYLACZNIE testy deterministyczne, darmowe, szybkie, PASS/FAIL.
# NIE wchodza: audyt i egzamin z kluczem Anthropic, winiety modelowe,
# kontrole starzenia danych (te sa warstwa 4, STRAZ) i raporty informacyjne.
#
# pull_request, nie push: bramka ma dzialac PRZED merge. push zostaje, zeby
# galaz glowna tez byla mierzona, ale prawo zatrzymania daje dopiero
# wymagany check przy PR (ustawienie repozytorium — patrz RAMA_GITHUB, D1).
name: Kontrola L1

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kontrola:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repozytorium refundacji
        uses: actions/checkout@v4
        with:
          path: psychai-refundacja

      # psychai-paczka jest PRYWATNE [ZAPIS: przebieg #1 z 50f68f5 dostal
      # "Not Found" z REST API]. Token tego repozytorium nie ma prawa jej
      # czytac, wiec bez sekretu PSYCHAI_RO_TOKEN audyt i trzy testy NIE MAJA
      # WEJSCIA.
      #
      # Brak wejscia NIE JEST tu zielonym swiatlem i nie jest tez powodem,
      # zeby repozytorium narzedzi stalo na czerwono w nieskonczonosc.
      # Rozwiazanie: sprawdzamy to, co da sie sprawdzic, a to, czego NIE
      # sprawdzono, jest WYPISANE — na gorze podsumowania, przy kazdym
      # przebiegu, nie w przypisie. Cisza o niesprawdzonym byloby dokladnie
      # ta klasa bledu, ktora ten audyt lapie.
      - name: Repozytorium paczki
        id: paczka
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: cm5-ai/psychai-paczka
          path: psychai-paczka
          fetch-depth: 0
          token: ${{ secrets.PSYCHAI_RO_TOKEN || github.token }}

      - name: Czy paczka jest
        id: jest
        run: |
          if [ -d psychai-paczka/projekt ]; then
            echo "paczka=tak" >> $GITHUB_OUTPUT
          else
            echo "paczka=nie" >> $GITHUB_OUTPUT
            echo "::warning::POKRYCIE NIEPELNE — nie ma dostepu do psychai-paczka."
          fi

      - name: Test odbioru ChPL (nie wymaga paczki)
        working-directory: psychai-refundacja
        run: python3 generator/chpl_test_odbioru.py

      - name: Testy strukturalne
        if: steps.jest.outputs.paczka == 'tak'
        working-directory: psychai-refundacja
        env:
          PSYCHAI_PACZKA: ${{ github.workspace }}/psychai-paczka
        run: |
          set -e
          python3 generator/test_drug_db_podzial.py
          python3 generator/test_przypisanie_klas.py
          python3 generator/test_pokrycie_18.py

      - name: Audyt kompletnosci
        if: steps.jest.outputs.paczka == 'tak'
        working-directory: psychai-refundacja
        env:
          PSYCHAI_PACZKA: ${{ github.workspace }}/psychai-paczka
        run: python3 generator/audyt_kompletnosci.py | tee audyt.txt

      - name: CZEGO NIE SPRAWDZONO
        if: steps.jest.outputs.paczka != 'tak'
        run: |
          { echo '## POKRYCIE NIEPELNE — brak dostepu do psychai-paczka';
            echo '';
            echo 'NIE URUCHOMIONO w tym przebiegu:';
            echo '- test podzialu DRUG_DB';
            echo '- test przypisania klas wobec ATC';
            echo '- test pokrycia modulu 18';
            echo '- audyt kompletnosci (14 regul)';
            echo '';
            echo 'Powod: psychai-paczka jest prywatne, a token tego repozytorium';
            echo 'nie ma prawa jej odczytac. Zielony wynik tego przebiegu znaczy';
            echo 'WYLACZNIE, ze przeszlo to, co dalo sie sprawdzic bez paczki.';
            echo '';
            echo 'Zeby domknac pokrycie: w Settings -> Secrets and variables ->';
            echo 'Actions dodaj sekret PSYCHAI_RO_TOKEN — fine-grained token';
            echo 'z prawem Contents: Read WYLACZNIE do cm5-ai/psychai-paczka.';
          } >> $GITHUB_STEP_SUMMARY

      # Zielony wynik reguly bez wejscia nic nie znaczy. Audyt sam to
      # drukuje; tu zamieniamy to w OBLANIE, zeby green-on-empty nie
      # przeszlo przez bramke.
      - name: Green-on-empty oblewa
        if: steps.jest.outputs.paczka == 'tak'
        working-directory: psychai-refundacja
        run: |
          if grep -q "BEZ WEJSCIA [1-9]" audyt.txt; then
            echo "FAIL: regula bez wejscia. Zielony kolor takiej reguly nic nie znaczy."
            grep "BRAK WEJSCIA" audyt.txt || true
            exit 1
          fi

      - name: Podsumowanie
        if: always() && steps.jest.outputs.paczka == 'tak'
        working-directory: psychai-refundacja
        run: |
          { echo '## Kontrola L1'; echo '```'; tail -25 audyt.txt 2>/dev/null; echo '```'; } >> $GITHUB_STEP_SUMMARY

      - name: Raport jako artefakt, nie commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audyt-${{ github.run_id }}
          path: psychai-refundacja/audyt.txt
          if-no-files-found: ignore
